name: LoThanhDeVuong Game

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          if ($LASTEXITCODE -ne 0) { exit 1 }
          python -m pip install -r requirements.txt
          if ($LASTEXITCODE -ne 0) { exit 1 }
          python -m pip install pyinstaller
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - name: Verify imports
        shell: pwsh
        run: |
          python -c "import pygame, customtkinter, pyvidplayer2; print('pygame', pygame.version.ver)"
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - name: Clean previous build files
        shell: pwsh
        run: |
          Remove-Item release, temp-game -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Path release, temp-game -Force | Out-Null

      - name: Build Windows executable
        shell: pwsh
        run: |
          python -m PyInstaller `
            --noconfirm `
            --clean `
            --onedir `
            --windowed `
            --name Game `
            --paths . `
            --paths src `
            --collect-all pygame `
            --collect-all customtkinter `
            --collect-all pyvidplayer2 `
            --distpath release `
            --workpath temp-game/build `
            --specpath temp-game `
            main.py
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - name: Add assets next to the exe
        shell: pwsh
        run: |
          Copy-Item -Recurse assets release/Game/assets
          Copy-Item README.md release/Game/README.md
          if (-not (Test-Path release/Game/Game.exe)) { throw "Game.exe not found" }

      - name: Package game as ZIP
        shell: pwsh
        run: |
          Compress-Archive `
            -Path release/Game `
            -DestinationPath release/Game-Windows.zip `
            -Force

      - name: Upload Windows game
        uses: actions/upload-artifact@v4
        with:
          name: Game-Windows
          path: release/Game-Windows.zip
          if-no-files-found: error
          retention-days: 14